[package]
name = "dummy-mcp-server-rust"
version = "0.1.0"
edition = "2024"
description = "Dummy MCP server for testing mcphost.eu deployments (rust)"

[dependencies]
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tokio-util = "0.7"
axum = "0.8"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
# Client-side features, needed only by examples/smoke.rs — kept out of
# [dependencies] so the deployed server binary doesn't link a client stack.
rmcp = { version = "3.1.4", features = [
    "client",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
] }
