[package]
name = "dummy-mcp-server-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
rmcp = { version = "3.1.2", features = ["transport-streamable-http-server", "server"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
